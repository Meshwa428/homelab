services:
  wud:
    image: ghcr.io/getwud/wud:latest
    container_name: wud
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Check for image updates every 4 hours
      - WUD_WATCHER_LOCAL_CRON=0 */4 * * *
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=true
      - WUD_LOG_LEVEL=info
      # Auto-update containers and prune old images
      - WUD_TRIGGER_DOCKER_LOCAL_PRUNE=true
      - WUD_TRIGGER_DOCKER_LOCAL_AUTO=true
      - WUD_TRIGGER_DOCKER_LOCAL_THRESHOLD=minor
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wud.rule=Host(`wud.homeserver.com`)"
      - "traefik.http.routers.wud.entrypoints=websecure"
      - "traefik.http.routers.wud.tls=true"
      - "traefik.http.services.wud.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
    name: proxy
