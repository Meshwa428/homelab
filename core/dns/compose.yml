services:
  ts-dns:
    image: tailscale/tailscale:latest
    container_name: ts-dns
    hostname: ${TS_HOSTNAME_DNS}
    env_file:
      - .env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./ts-dns-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    networks: [proxy]
    labels:
      # Updated by scripts/idle-critical-update.sh (idle-gated), not WUD.
      - "wud.watch=false"

  adguard:
    image: adguard/adguardhome
    container_name: adguard-internal
    restart: unless-stopped
    network_mode: "service:ts-dns"
    volumes:
      - ./data:/opt/adguardhome/work
      - ./config:/opt/adguardhome/conf
    depends_on:
      - ts-dns
    labels:
      # Updated by scripts/idle-critical-update.sh (idle-gated), not WUD.
      - "wud.watch=false"
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.home.meshwa.space`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls=true"
      - "traefik.http.routers.adguard.tls.certresolver=letsencrypt"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.adguard-local.rule=Host(`adguard.homeserver.com`)"
      - "traefik.http.routers.adguard-local.entrypoints=websecure"
      - "traefik.http.routers.adguard-local.tls=true"
      - "traefik.http.routers.adguard-local.service=adguard"

networks:
  proxy:
    external: true
    name: proxy
