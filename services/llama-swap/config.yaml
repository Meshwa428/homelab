# =============================================================================
# llama-swap — Configuration File
# =============================================================================
# Models are registered here and loaded on-demand when a request comes in.
# Idle models are automatically unloaded after ttl seconds.
#
# To add a new model, run:
#   ./scripts/hf-pull.sh <hf-repo-id> [filename-pattern] [model-key]
#
# Example:
#   ./scripts/hf-pull.sh bartowski/Mistral-7B-Instruct-v0.3-GGUF "*Q5_K_M.gguf" mistral
# =============================================================================

models:
