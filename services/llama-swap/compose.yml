services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: llama-swap
    restart: unless-stopped
    volumes:
      - ./models:/models
      - ./config.yaml:/app/config.yaml
    networks:
      - proxy
    command: --config /app/config.yaml --listen 0.0.0.0:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llama-swap.rule=Host(`ollama.home.meshwa.space`)"
      - "traefik.http.routers.llama-swap.entrypoints=websecure"
      - "traefik.http.routers.llama-swap.tls=true"
      - "traefik.http.routers.llama-swap.tls.certresolver=letsencrypt"
      - "traefik.http.services.llama-swap.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
    name: proxy
